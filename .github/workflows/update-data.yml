
name: Refresh dashboard market data

run-name: "Dashboard Refresh - ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Dashboard refresh request ID"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Retrieve market prices
        run: python scripts/update_market.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add market-data.json

          if ! git diff --cached --quiet; then
            git commit -m "Update market data"
            git push
          fi
